name: SkillBun Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-rules:
    name: Firestore Rules Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies and Firebase CLI
        run: |
          npm ci
          npm install --global firebase-tools@15.29.0
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Execute rules against synthetic demo data
        run: npm run test:rules

  audit-and-verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          # The native CPU runtime is already bundled; GPU downloads are unused.
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Verify Native RAG Runtime
        run: node --input-type=module -e "await import('@huggingface/transformers')"

      - name: Document Template Immutability Guard
        run: npm run guard:templates

      - name: Static Code Analysis (ESLint)
        run: npm run lint

      - name: Unit & Security Test Suite
        run: npm test

      - name: Production Build Verification
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://skillbun.tech
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: skillbun-75d10
